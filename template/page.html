<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimal-ui">
  <title>{{title}}</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:400,700,900"/>
  <link rel="stylesheet" href="https://sauvc.org/css/style.css"/>
  <style>
    /* Keep headings with the content that follows, and figures and table rows whole, across PDF pages */
    h2, h3, h4, .img-container { break-after: avoid; }
    img, tr, .image-caption { break-inside: avoid; }

    body { counter-reset: figureCounter; }
    .img-container {
      counter-increment: figureCounter;
    }
    .img-container + .image-caption:before {
      content: "▲ Figure " counter(figureCounter) ": "
    }
  </style>
</head>
<body>
  <div class="hero bubbles">
    <h3 class="synopsis">The Singapore AUV Challenge {{year}}<br>
      <strong style="font-size:1.2em;">Rulebook</strong>
    </h3>

    <ul class="stats">
      <li>
        <div class="caption">Current Rulebook version</div>
        <div class="num" style="width: 100%;">{{version}}</div>
      </li>
    </ul>

    <h3 class="welcome">
      <span style="font-size: .5em;">Last updated on</span><br>
      {{last_updated_date}}
    </h3>
  </div>

  <section>
    {{~> content}}
  </section>
</body>
</html>
